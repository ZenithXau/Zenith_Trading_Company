<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ZENITH TRADING FLOOR</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #0a0a0a; color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
#hud { position: absolute; top: 8px; left: 14px; font-size: 13px; letter-spacing: 3px; color: #d4af37; z-index: 10; font-weight: 700; background: rgba(10,10,10,0.9); padding: 4px 8px; border-radius: 4px; }
.layout { display: flex; height: 100vh; padding-top: 36px; }
.layout.maximized .side { display: none; }
.layout.maximized .main { width: 100%; }
.main { flex: 1; padding: 12px; overflow-y: auto; }
.side { width: 420px; background: #111; border-left: 1px solid #222; padding: 14px; overflow-y: auto; }
.dashboard { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 10px 0 12px; }
.dash-card { background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 8px 10px; cursor: pointer; }
.dash-card.no-click { cursor: default; }
.dash-card:hover { border-color: #d4af37; }
.dash-card.no-click:hover { border-color: #333; }
.dash-card.active { border: 2px solid #d4af37; }
.dash-label { font-size: 10px; color: #888; letter-spacing: 1px; }
.dash-value { font-size: 16px; font-weight: 700; color: #d4af37; margin-top: 2px; }
.dash-value.green { color: #22c55e; }
.dash-value.red { color: #ef4444; }
.timeframes { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
.tf { background: #1a1a1a; border: 1px solid #333; color: #aaa; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; }
.tf.active { background: #d4af37; border-color: #d4af37; color: #000; }
#tv_chart { width: 100%; height: 320px; background: #0d0d0d; border: 1px solid #222; border-radius: 4px; transition: height 0.3s; }
#tv_chart.maximized { height: 75vh; }
.chart-controls { text-align: right; margin-bottom: 4px; }
.chart-btn { background: #1a1a1a; border: 1px solid #333; color: #d4af37; padding: 3px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; }
.agents { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.agent { background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 8px; cursor: pointer; font-size: 12px; }
.agent.selected { border: 2px solid #d4af37; }
.agent.ready { border-color: #22c55e; box-shadow: 0 0 12px rgba(34,197,94,0.6); }
.lamp { width: 8px; height: 8px; border-radius: 50%; background: #444; display: inline-block; margin-right: 6px; }
.agent.ready .lamp { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
.subtitle { font-size: 9px; color: #d4af37; margin-top: 2px; }
#panel { margin-top: 12px; background: #111; border: 1px solid #333; border-radius: 6px; padding: 12px; font-size: 12px; display: none; max-height: 260px; overflow-y: auto; }
.journal-entry { background: #1a1a1a; padding: 6px 8px; border-radius: 4px; margin-bottom: 4px; font-size: 11px; border-left: 2px solid #d4af37; }
.detail-trade { background: #1a1a1a; padding: 8px; margin-bottom: 4px; border-radius: 4px; font-size: 11px; border-left: 2px solid #d4af37; }
.promote-btn, .demote-btn { background: #22c55e; color: #000; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-top: 8px; margin-right: 6px; }
.demote-btn { background: #ef4444; color: #fff; }
.journal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
#journal { max-height: 380px; overflow-y: auto; padding-right: 4px; }
#journal::-webkit-scrollbar { width: 6px; }
#journal::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 3px; }
#agentFilter { background: #1a1a1a; border: 1px solid #333; color: #f5f5f5; padding: 4px 8px; border-radius: 4px; font-size: 11px; }
</style>
</head>
<body>
<div id="hud">ZENITH TRADING FLOOR</div>
<div class="layout">
    <div class="main">
        <div style="font-size:11px;color:#888;margin:0 0 6px;">WALL</div>
        <div class="timeframes" id="wallCoins">
            <div class="tf active" data-coin="BINANCE:BTCUSDT">BTC</div>
            <div class="tf" data-coin="BINANCE:SOLUSDT">SOL</div>
            <div class="tf" data-coin="BINANCE:ETHUSDT">ETH</div>
            <div class="tf" data-coin="OANDA:XAUUSD">XAU</div>
            <div class="tf" data-coin="OANDA:XAGUSD">XAG</div>
            <div class="tf" data-coin="CAPITALCOM:US30">US30</div>
            <div class="tf" data-coin="CAPITALCOM:NAS100">NASDAQ</div>
        </div>
        <div class="timeframes" id="tfs">
            <div class="tf active" data-tf="1">M1</div>
            <div class="tf" data-tf="5">M5</div>
            <div class="tf" data-tf="15">M15</div>
            <div class="tf" data-tf="60">1H</div>
            <div class="tf" data-tf="240">4H</div>
            <div class="tf" data-tf="D">1D</div>
            <div class="tf" data-tf="W">1W</div>
        </div>
        <div class="chart-controls"><button class="chart-btn" id="chartToggle">Maximieren</button></div>
        <div id="tv_chart"></div>
        <div class="dashboard">
            <div class="dash-card" id="totalCard"><div class="dash-label">TOTAL TRADES (CURRENT DAY)</div><div class="dash-value" id="total">0</div></div>
            <div class="dash-card" id="actualCard"><div class="dash-label">ACTUAL OPEN TRADES</div><div class="dash-value" id="actual">0</div></div>
            <div class="dash-card no-click"><div class="dash-label">TOTAL TRADES</div><div class="dash-value" id="grandTotal">0</div></div>
            <div class="dash-card no-click"><div class="dash-label">PORTFOLIO</div><div class="dash-value" id="port">$200.00</div></div>
            <div class="dash-card no-click"><div class="dash-label">PnL</div><div class="dash-value green" id="pnl">+$0.00</div></div>
            <div class="dash-card no-click"><div class="dash-label">WIN RATE</div><div class="dash-value" id="win">0%</div></div>
        </div>
        <div class="agents" id="mainAgents"></div>
        <div id="panel">
            <div id="panel-title"></div>
            <div id="panel-content"></div>
        </div>
    </div>
    <div class="side">
        <div style="font-size:11px;letter-spacing:2px;color:#d4af37;margin-bottom:8px;">TRADING ACADEMY (CRYPTO)</div>
        <div class="agents" id="trainCrypto"></div>
        <div style="font-size:11px;letter-spacing:2px;color:#d4af37;margin:16px 0 8px;">TRADING ACADEMY (FOREX)</div>
        <div class="agents" id="trainForex"></div>
        <div class="journal-header">
            <div style="font-size:11px;color:#888;">JOURNAL (Bot-Aktivität)</div>
            <select id="agentFilter">
                <option value="">Alle Agents</option>
                <option value="Risk">Risk</option>
                <option value="MEME">MEME</option>
                <option value="BTC">BTC</option>
                <option value="ALT">ALT</option>
                <option value="Position">Position</option>
                <option value="FOREX">FOREX</option>
            </select>
        </div>
        <div id="journal"></div>
    </div>
</div>
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
const BACKEND = 'https://zenith-backend-production-8af9.up.railway.app';

let widget = null;
let currentSymbol = "BINANCE:BTCUSDT";
let currentInterval = "1";
let state = { cryptoAgents:[], forexAgents:[], promotedAgents:[], journalEntries:[], liveTrades:[], openTrades:[], todayTrades:[] };
let panelMode = null;
let selectedAgent = null;
let currentFilter = "";

function loadTV() {
    if (widget) widget.remove();
    widget = new TradingView.widget({
        container_id: "tv_chart",
        autosize: true,
        symbol: currentSymbol,
        interval: currentInterval,
        timezone: "Etc/UTC",
        theme: "dark",
        style: "1",
        locale: "de",
        toolbar_bg: "#0a0a0a",
        enable_publishing: false,
        hide_top_toolbar: false,
        allow_symbol_change: false,
        backgroundColor: "#0d0d0d",
        gridColor: "#1a1a1a"
    });
}

document.getElementById('chartToggle').addEventListener('click', () => {
    const layout = document.querySelector('.layout');
    const chart = document.getElementById('tv_chart');
    const btn = document.getElementById('chartToggle');
    layout.classList.toggle('maximized');
    chart.classList.toggle('maximized');
    btn.textContent = chart.classList.contains('maximized') ? 'Minimieren' : 'Maximieren';
    setTimeout(() => { if (widget && widget.resize) widget.resize(); }, 350);
});

document.getElementById('tfs').addEventListener('click', e => {
    if (!e.target.dataset.tf) return;
    document.querySelectorAll('#tfs .tf').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    currentInterval = e.target.dataset.tf;
    loadTV();
});

document.getElementById('wallCoins').addEventListener('click', e => {
    if (!e.target.dataset.coin) return;
    document.querySelectorAll('#wallCoins .tf').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    currentSymbol = e.target.dataset.coin;
    loadTV();
});

document.getElementById('agentFilter').addEventListener('change', e => {
    currentFilter = e.target.value;
    renderJournal();
});

function selectAgentEl(el) {
    if (selectedAgent === el) {
        el.classList.remove('selected');
        selectedAgent = null;
        document.getElementById('panel').style.display = "none";
        return;
    }
    document.querySelectorAll('.agent').forEach(a => a.classList.remove('selected'));
    el.classList.add('selected');
    selectedAgent = el;
}

async function fetchState() {
    try {
        const res = await fetch(BACKEND + '/api/state');
        if (!res.ok) throw new Error();
        state = await res.json();
        document.getElementById('hud').style.color = '#d4af37';
        document.getElementById('hud').textContent = 'ZENITH TRADING FLOOR';
        renderAll();
    } catch (e) {
        document.getElementById('hud').style.color = '#ef4444';
        document.getElementById('hud').textContent = 'ZENITH TRADING FLOOR (OFFLINE)';
    }
}

function renderJournal() {
    const journal = document.getElementById('journal');
    journal.innerHTML = "";
    const filtered = currentFilter 
        ? state.journalEntries.filter(e => e.includes(currentFilter))
        : state.journalEntries;
    filtered.slice(0, 40).forEach(entry => {
        const el = document.createElement('div');
        el.className = "journal-entry";
        el.innerHTML = entry;
        journal.appendChild(el);
    });
}

function showTrades(mode) {
    if (panelMode === mode) {
        document.getElementById('panel').style.display = "none";
        panelMode = null;
        document.querySelectorAll('.dash-card').forEach(c => c.classList.remove('active'));
        return;
    }
    panelMode = mode;
    document.querySelectorAll('.dash-card').forEach(c => c.classList.remove('active'));
    if (mode === "total") document.getElementById('totalCard').classList.add('active');
    if (mode === "actual") document.getElementById('actualCard').classList.add('active');
    document.getElementById('panel').style.display = "block";
    const list = mode === "total" ? state.todayTrades : state.openTrades;
    document.getElementById('panel-title').innerHTML = mode === "total" 
        ? `<b>Trades heute</b> (${list.length})` 
        : `<b>Offene Positionen</b> (${list.length})`;
    document.getElementById('panel-content').innerHTML = list.map(t => `
        <div class="detail-trade">
            ${t.time} · ${t.agent} · ${t.coin} ${t.side}<br>
            Entry: ${t.entry} · TP: ${t.tp} · SL: ${t.sl}<br>
            ${t.exit ? "Exit: " + t.exit + " · " : "Offen · "}
            <span style="color:${t.pnl>=0?'#22c55e':'#ef4444'}">PnL: ${t.pnl}%</span>
        </div>
    `).join("") || "Keine Trades";
}

document.getElementById('totalCard').addEventListener('click', () => showTrades("total"));
document.getElementById('actualCard').addEventListener('click', () => showTrades("actual"));

function updateDashboard() {
    document.getElementById('total').textContent = state.todayTrades.length;
    document.getElementById('actual').textContent = state.openTrades.length;
    document.getElementById('grandTotal').textContent = state.totalTradeCount || state.liveTrades.length;
    const totalPnl = state.liveTrades.reduce((s, t) => s + (t.pnl || 0), 0);
    document.getElementById('pnl').textContent = (totalPnl >= 0 ? "+" : "") + totalPnl.toFixed(2);
    document.getElementById('pnl').className = "dash-value " + (totalPnl >= 0 ? "green" : "red");
    document.getElementById('port').textContent = "$" + (200 + totalPnl).toFixed(2);
    const wins = state.liveTrades.filter(t => t.pnl > 0).length;
    document.getElementById('win').textContent = state.liveTrades.length ? Math.round(wins / state.liveTrades.length * 100) + "%" : "0%";
}

const defaultMain = [
    { id: "Risk", subtitle: "Checks all" },
    { id: "MEME", subtitle: "Wallets" },
    { id: "BTC", subtitle: "Bitcoin" },
    { id: "ALT", subtitle: "Alts" },
    { id: "Position", subtitle: "STOP / GO" },
    { id: "FOREX", subtitle: "XAU XAG US30 NASDAQ" }
];

function renderMainAgents() {
    const el = document.getElementById('mainAgents');
    const all = [...defaultMain.map(a => ({...a, type: "default"})), ...state.promotedAgents.map(a => ({id: a.id, subtitle: a.role, type: "promoted"}))];
    el.innerHTML = all.map(a => `
        <div class="agent" data-agent="${a.id}" data-type="${a.type}">
            <span class="lamp"></span>${a.id}
            <div class="subtitle">${a.subtitle}</div>
        </div>
    `).join("");
    el.querySelectorAll('.agent').forEach(agentEl => {
        agentEl.addEventListener('click', () => {
            selectAgentEl(agentEl);
            if (!agentEl.classList.contains('selected')) return;
            const id = agentEl.dataset.agent;
            const type = agentEl.dataset.type;
            document.getElementById('panel').style.display = "block";
            document.getElementById('panel-title').innerHTML = `<b>${id}</b>`;
            let content = `Session aktiv · Backend`;
            if (type === "promoted") {
                content += `<br><button class="demote-btn" data-id="${id}">Zurück in Academy</button>`;
            }
            document.getElementById('panel-content').innerHTML = content;
            const demoteBtn = document.querySelector('.demote-btn');
            if (demoteBtn) {
                demoteBtn.onclick = async () => {
                    await fetch(BACKEND + '/api/demote', {
                        method: 'POST',
                        headers: {'Content-Type':'application/json'},
                        body: JSON.stringify({id})
                    });
                    document.getElementById('panel').style.display = "none";
                    fetchState();
                };
            }
        });
    });
}

function renderAcademy() {
    const cEl = document.getElementById('trainCrypto');
    cEl.innerHTML = state.cryptoAgents.map(a => `
        <div class="agent ${a.progress >= 98 ? 'ready' : ''}" data-id="${a.id}">
            <span class="lamp"></span>${a.id}
            <div class="subtitle">${a.role} · ${Math.floor(a.progress)}%</div>
        </div>
    `).join("");
    const fEl = document.getElementById('trainForex');
    fEl.innerHTML = state.forexAgents.map(a => `
        <div class="agent ${a.progress >= 98 ? 'ready' : ''}" data-id="${a.id}">
            <span class="lamp"></span>${a.id}
            <div class="subtitle">${a.role} · ${Math.floor(a.progress)}%</div>
        </div>
    `).join("");

    document.querySelectorAll('#trainCrypto .agent, #trainForex .agent').forEach(el => {
        el.addEventListener('click', () => {
            selectAgentEl(el);
            if (!el.classList.contains('selected')) return;
            const id = el.dataset.id;
            const list = id.startsWith('C') ? state.cryptoAgents : state.forexAgents;
            const ag = list.find(x => x.id === id);
            if (!ag) return;
            document.getElementById('panel').style.display = "block";
            document.getElementById('panel-title').innerHTML = `<b>${id}</b> · ${ag.role}`;
            let content = `Fortschritt: ${Math.floor(ag.progress)}%`;
            if (ag.progress >= 98) {
                content += `<br><button class="promote-btn" data-id="${id}">Als Trader übernehmen?</button>`;
            }
            document.getElementById('panel-content').innerHTML = content;
            const btn = document.querySelector('.promote-btn');
            if (btn) {
                btn.onclick = async () => {
                    await fetch(BACKEND + '/api/promote', {
                        method: 'POST',
                        headers: {'Content-Type':'application/json'},
                        body: JSON.stringify({id})
                    });
                    document.getElementById('panel').style.display = "none";
                    fetchState();
                };
            }
        });
    });
}

function renderAll() {
    renderAcademy();
    renderMainAgents();
    renderJournal();
    updateDashboard();
}

setInterval(fetchState, 4000);
fetchState();
loadTV();
</script>
</body>
</html>
